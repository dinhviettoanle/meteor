data:
    data_dir:         musemorphose_data/symphonynet_full_multitrack_melfull/remi
    melody_mask_dir:  musemorphose_data/symphonynet_full_multitrack_melfull/melody
    vocab_path:       musemorphose_data/pickles/symphonynet_full_multitrack_melfull_vocab.pkl
    train_split:      musemorphose_data/pickles/symphonynet_full_multitrack_train_pieces.pkl
    val_split:        musemorphose_data/pickles/symphonynet_full_multitrack_val_pieces.pkl
    test_split:       musemorphose_data/pickles/symphonynet_full_multitrack_test_pieces.pkl
    max_bars:         8
    enc_seqlen:       512
    dec_seqlen:       4096
    batch_size:       6
    melody_tokens:    False
    melody_first:     True
    multitrack_mapping: 'mmt'

tokenization:
    pitch_encoding: 'absolute'
    header_pitch_range: True
    header_repeatability: True
    header_chords: True
    melodic_tokens: 'track'
    melodic_tokens_position: 'before'
    order_first: 'beat'

model:
    enc_n_layer:      10
    enc_n_head:       8
    enc_d_model:      512
    enc_d_ff:         2048
    dec_n_layer:      10
    dec_n_head:       8
    dec_d_model:      512
    dec_d_ff:         2048
    d_embed:          512
    d_latent:         256
    use_attr_cls:     True
    d_polyph_emb:     64
    d_rfreq_emb:      64
    use_attr_multitrack_cls: False
    d_harmdiv_emb:    64
    d_rhythmdiv_emb:  64
    cond_mode:        in-attn
    pretrained_params_path:      null
    pretrained_optim_path:       null

training:
    device:           cuda:1
    ckpt_dir:         meteor_models/meteor_baseline/
    trained_steps:    0
    max_epochs:       1000
    max_lr:           1.0e-4
    min_lr:           5.0e-6
    lr_warmup_steps:  200
    lr_decay_steps:   300000
    no_kl_steps:      30001
    no_melody_steps:  null
    kl_cycle_steps:   5000
    kl_max_beta:      0.5
    free_bit_lambda:  0.1
    constant_kl:      False
    ckpt_interval:    200
    log_interval:     10
    val_interval:     1000

generate:
    temperature:                1.2
    nucleus_p:                  0.9
    use_latent_sampling:        False
    latent_sampling_var:        0.0
    max_bars:                   8       # could be set to match the longest input piece during generation (inference)
    dec_seqlen:                 2000     # could be set to match the longest input piece during generation (inference)
    max_input_dec_seqlen:       4096     # should be set to equal to or less than `dec_seqlen` used during training
    ## Generate from a piece in the test set
    # gen_from_piece:             "10859" # "3814911.mid"
    # gen_from_bar:               34
    ## Generate from a midi file
    # gen_from_midi:              meteor_userstudy/data_leadsheet/066/lead sheet.mid
    # gen_from_bar:               0
    use_primer:                 True
    fine_control:
        ## Use raw values by bar
        polyph:                  [5, 5, 5, 5, 4, 3, 6, 6]
        rfreq:                   [1, 1, 1, 1, 1, 1, 2, 2]
        ## Use differences with the initial attributes
        # polyph_diff:            [0, 0, -3, -3, 3, 3, 0, 0]
